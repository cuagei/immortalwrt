name: ImmortalWrt AArch64 固件编译

# 当您手动点击 "Run workflow" 按钮或将代码推送到 main 分支时触发
on:
  workflow_dispatch:
  push:
    branches:
      - main

# 工作流执行权限
permissions:
  contents: write

jobs:
  build:
    # 使用标准的 ubuntu-latest Runner，通过缓存和清理来管理空间
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码 (Checkout)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: openwrt-24.10

      # 2. 设置环境 (Setting up environment)
      - name: Set up build environment
        run: |
          # 增加编译线程，加速编译。标准 Runner 默认为 2 核。
          echo "BUILD_THREADS=$(nproc)" >> $GITHUB_ENV
          sudo apt update
          # 安装 ccache
          sudo apt install -y build-essential subversion git libncurses5-dev zlib1g-dev gawk python3 unzip file wget ccache

      # 3. 配置 Cache (缓存)
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          # 缓存 dl (源代码包) 和 ccache (编译缓存) 目录
          path: |
            dl
            ccache
          key: ${{ runner.os }}-immortalwrt-${{ hashFiles('feeds.conf.default', '.config') }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-

      # 4. 更新 Feeds (Update feeds)
      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 5. 【已移除】添加自定义 Feeds，因为我们将暂时移除 OpenClash

      # 6. 生成 .config 文件 (Generate initial .config)
      - name: Generate .config
        run: |
          make defconfig

      # 7. 自定义配置 (Customize .config)
      - name: Apply custom configuration
        run: |
          CONFIG_FILE=".config"
          
          # 目标平台配置 (AArch64 Generic)
          sed -i 's/CONFIG_TARGET_.*=y/# CONFIG_TARGET_.* is not set/g' $CONFIG_FILE
          echo "CONFIG_TARGET_arm64=y" >> $CONFIG_FILE
          echo "CONFIG_TARGET_arm64_generic=y" >> $CONFIG_FILE
          echo "CONFIG_TARGET_PROFILE_GENERIC=y" >> $CONFIG_FILE

          # 软件包配置 (Packages)
          # 【已移除】 luci-app-openclash openclash luci-app-udpxy udpxy
          PACKAGES="luci-base luci-mod-admin-full uhttpd luci-i18n-base-zh-cn luci-theme-bootstrap \
                    kmod-fs-ext4 block-mount kmod-usb-storage kmod-usb-core \
                    kmod-usb-ohci kmod-usb-uhci firewall iptables ip6tables luci-app-firewall"
          
          # 启用所需软件包
          for pkg in $PACKAGES; do
              echo "CONFIG_PACKAGE_$pkg=y" >> $CONFIG_FILE
          done
          
          # 禁用 Argon 主题
          sed -i '/CONFIG_PACKAGE_luci-theme-argon/d' $CONFIG_FILE
          sed -i '/CONFIG_PACKAGE_luci-app-argon-config/d' $CONFIG_FILE
          echo "CONFIG_PACKAGE_luci-theme-argon=n" >> $CONFIG_FILE
          echo "CONFIG_PACKAGE_luci-app-argon-config=n" >> $CONFIG_FILE

          # 启用 Luci 经典主题
          echo "CONFIG_PACKAGE_luci-theme-openwrt=y" >> $CONFIG_FILE

          # 【最终关键修复】强制禁用所有 Rust 工具链和相关依赖
          echo "CONFIG_PACKAGE_rust=n" >> $CONFIG_FILE
          echo "CONFIG_HAS_RUST=n" >> $CONFIG_FILE
          sed -i '/CONFIG_HOST_PACKAGE_RUST/d' $CONFIG_FILE
          sed -i '/CONFIG_HOST_RUST/d' $CONFIG_FILE
          
          # 确保配置生效
          make defconfig
          
          # 启用 ccache
          echo "CONFIG_CCACHE=y" >> $CONFIG_FILE
          make defconfig # 再次运行 defconfig 确保 ccache 生效

      # 8. 添加 UCI Defaults 脚本 (Add UCI Defaults)
      - name: Add UCI Defaults for custom settings
        run: |
          mkdir -p files/etc/uci-defaults
          UCI_SCRIPT="files/etc/uci-defaults/99_custom_config"
          
          echo '#!/bin/sh' > "$UCI_SCRIPT"
          echo '# 1. LuCI 语言' >> "$UCI_SCRIPT"
          echo 'uci set luci.main.lang="zh_CN"' >> "$UCI_SCRIPT"
          echo 'uci commit luci' >> "$UCI_SCRIPT"
          echo '' >> "$UCI_SCRIPT"
          echo '# 2. 静态 IP 192.168.1.250' >> "$UCI_SCRIPT"
          echo 'uci set network.lan.ipaddr="192.168.1.250"' >> "$UCI_SCRIPT"
          echo 'uci set network.lan.netmask="255.255.255.0"' >> "$UCI_SCRIPT"
          echo 'uci set network.lan.proto="static"' >> "$UCI_SCRIPT"
          echo 'uci commit network' >> "$UCI_SCRIPT"
          echo '/etc/init.d/network restart # 重启网络服务使静态IP生效' >> "$UCI_SCRIPT"
          echo '' >> "$UCI_SCRIPT"
          # 【已移除】OpenClash 和 udpxy 的配置
          echo 'exit 0' >> "$UCI_SCRIPT"
          chmod +x "$UCI_SCRIPT"

      # 9. 下载所有源代码（利用缓存，只有缺失的才下载）
      - name: Download all source packages
        run: |
          make download -j$(nproc)

      # 10. 【最终空间清理】在编译前清理 build_dir/ 和 tmp/ 以释放最大空间
      - name: Final space cleanup
        run: |
          echo "清理 build_dir 和 tmp 目录以释放最大空间..."
          rm -rf build_dir/
          rm -rf tmp/
          mkdir -p build_dir tmp

          echo "清理后的磁盘空间："
          df -h

      # 11. 核心编译步骤 (Compile firmware)
      - name: Compile firmware
        id: compile
        run: |
          echo "Start compiling..."
          set -o pipefail
          make -j${BUILD_THREADS} V=s 2>&1 | tee build.log

      # 12. 失败时打印日志 (Error Report)
      - name: Print failure log
        if: ${{ failure() && steps.compile.outcome == 'failure' }}
        run: |
          echo "::error::--- 编译失败日志尾部 (最后 50 行) ---"
          tail -n 50 build.log
          echo "::error::------------------------------------------"
          
      # 13. 整理并压缩产物 (Package artifacts)
      - name: Package artifacts
        if: success()
        run: |
          cd bin/targets/arm64/generic
          IMG_FILE=$(ls openwrt-*-arm64-generic-ext4-combined.img.gz 2>/dev/null || echo "")

          if [ -n "$IMG_FILE" ]; then
              zip -r build_artifacts.zip "$IMG_FILE"
          else
              echo "::error file=Package artifacts::无法找到目标固件文件。"
              exit 1
          fi

      # 14. 上传固件 (Upload artifacts)
      - name: Upload firmware to release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_AArch64_192.168.1.250
          path: bin/targets/arm64/generic/build_artifacts.zip
          retention-days: 7
