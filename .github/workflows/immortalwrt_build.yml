name: ImmortalWrt AArch64 固件编译

# 当您手动点击 "Run workflow" 按钮或将代码推送到 main 分支时触发
on:
  workflow_dispatch:
  push:
    branches:
      - main

# 工作流执行权限
permissions:
  contents: write

jobs:
  build:
    # 【关键修正】切换回标准的、快速可用的 Runner，但需要配合后续的清理步骤。
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码 (Checkout)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 确保拉取官方仓库作为基线
          repository: immortalwrt/immortalwrt
          # 使用您指定的 openwrt-24.10 分支
          ref: openwrt-24.10

      # 2. 设置环境 (Setting up environment)
      - name: Set up build environment
        run: |
          # 增加编译线程，加速编译。标准 Runner 默认为 2 核。
          echo "BUILD_THREADS=$(nproc)" >> $GITHUB_ENV
          sudo apt update
          sudo apt install -y build-essential subversion git libncurses5-dev zlib1g-dev gawk python3 unzip file wget

      # 3. 更新 Feeds (Update feeds)
      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 4. 添加自定义 Feeds (Add custom feeds)
      - name: Add OpenClash feed
        run: |
          echo 'src-git openclash https://github.com/vernesong/OpenClash.git' >> feeds.conf.default
          ./scripts/feeds update openclash
          ./scripts/feeds install -a -p openclash
          
      # 5. 生成 .config 文件 (Generate initial .config)
      - name: Generate .config
        run: |
          # 运行 defconfig 来生成默认配置
          make defconfig

      # 6. 自定义配置 (Customize .config)
      - name: Apply custom configuration
        run: |
          CONFIG_FILE=".config"
          
          # 目标平台配置 (AArch64 Generic)
          sed -i 's/CONFIG_TARGET_.*=y/# CONFIG_TARGET_.* is not set/g' $CONFIG_FILE
          echo "CONFIG_TARGET_arm64=y" >> $CONFIG_FILE
          echo "CONFIG_TARGET_arm64_generic=y" >> $CONFIG_FILE
          echo "CONFIG_TARGET_PROFILE_GENERIC=y" >> $CONFIG_FILE

          # 软件包配置 (Packages)
          PACKAGES="luci-base luci-mod-admin-full uhttpd luci-i18n-base-zh-cn luci-theme-bootstrap \
                    luci-app-openclash openclash luci-app-udpxy udpxy \
                    kmod-fs-ext4 block-mount kmod-usb-storage kmod-usb-core \
                    kmod-usb-ohci kmod-usb-uhci firewall iptables ip6tables luci-app-firewall"
          
          # 启用所需软件包
          for pkg in $PACKAGES; do
              echo "CONFIG_PACKAGE_$pkg=y" >> $CONFIG_FILE
          done
          
          # 禁用 Argon 主题 (如果默认启用了)
          sed -i '/CONFIG_PACKAGE_luci-theme-argon/d' $CONFIG_FILE
          sed -i '/CONFIG_PACKAGE_luci-app-argon-config/d' $CONFIG_FILE
          echo "CONFIG_PACKAGE_luci-theme-argon=n" >> $CONFIG_FILE
          echo "CONFIG_PACKAGE_luci-app-argon-config=n" >> $CONFIG_FILE

          # 启用 Luci 经典主题
          echo "CONFIG_PACKAGE_luci-theme-openwrt=y" >> $CONFIG_FILE

          # 【关键修复】禁用 Rust 工具链，以避免 "No space left on device" 错误
          echo "CONFIG_PACKAGE_rust=n" >> $CONFIG_FILE
          echo "CONFIG_HAS_RUST=n" >> $CONFIG_FILE
          
          # 确保配置生效
          make defconfig

      # 7. 添加 UCI Defaults 脚本 (Add UCI Defaults)
      # 使用 echo 方式写入，避免 YAML 解析问题
      - name: Add UCI Defaults for custom settings
        run: |
          mkdir -p files/etc/uci-defaults
          
          # 创建并写入 UCI Defaults 脚本
          UCI_SCRIPT="files/etc/uci-defaults/99_custom_config"
          
          echo '#!/bin/sh' > "$UCI_SCRIPT"
          echo '# 1. LuCI 语言' >> "$UCI_SCRIPT"
          echo 'uci set luci.main.lang="zh_CN"' >> "$UCI_SCRIPT"
          echo 'uci commit luci' >> "$UCI_SCRIPT"
          echo '' >> "$UCI_SCRIPT"
          echo '# 2. 静态 IP 192.168.1.250' >> "$UCI_SCRIPT"
          echo 'uci set network.lan.ipaddr="192.168.1.250"' >> "$UCI_SCRIPT"
          echo 'uci set network.lan.netmask="255.255.255.0"' >> "$UCI_SCRIPT"
          echo 'uci set network.lan.proto="static"' >> "$UCI_SCRIPT"
          echo 'uci commit network' >> "$UCI_SCRIPT"
          echo '/etc/init.d/network restart # 重启网络服务使静态IP生效' >> "$UCI_SCRIPT"
          echo '' >> "$UCI_SCRIPT"
          echo '# 3. 启用 OpenClash 和 udpxy' >> "$UCI_SCRIPT"
          echo 'uci set openclash.config.enable_openclash="1"' >> "$UCI_SCRIPT"
          echo 'uci commit openclash' >> "$UCI_SCRIPT"
          echo '/etc/init.d/openclash enable' >> "$UCI_SCRIPT"
          echo '/etc/init.d/openclash start' >> "$UCI_SCRIPT"
          echo '' >> "$UCI_SCRIPT"
          echo 'uci set udpxy.udpxy.enabled="1"' >> "$UCI_SCRIPT"
          echo 'uci set udpxy.udpxy.port="4022"' >> "$UCI_SCRIPT"
          echo 'uci commit udpxy' >> "$UCI_SCRIPT"
          echo '/etc/init.d/udpxy enable' >> "$UCI_SCRIPT"
          echo '/etc/init.d/udpxy start' >> "$UCI_SCRIPT"
          echo '' >> "$UCI_SCRIPT"
          echo 'exit 0' >> "$UCI_SCRIPT"

          chmod +x "$UCI_SCRIPT"

      # 8. 下载所有源代码
      - name: Download all source packages
        run: |
          make download -j$(nproc)

      # 9. 【关键空间优化】清理下载和临时目录以释放空间
      # 仅保留编译所需的 tar 包，删除不需要的包和临时文件
      - name: Clean up temporary files
        run: |
          echo "清理 build_dir 目录下的临时文件..."
          find build_dir/ -type f -name "*.o" -delete 2>/dev/null
          find build_dir/ -type f -name "*.gcda" -delete 2>/dev/null
          find build_dir/ -type f -name "*.gcno" -delete 2>/dev/null
          rm -rf build_dir/target-*/compile_log.* 2>/dev/null
          
          echo "清理 dl 目录下的文件，仅保留 tar/zip 压缩包..."
          find dl -type f ! -name '*.tar.*' ! -name '*.zip' ! -name '*.gz' -delete
          
          # 显示清理后的磁盘空间，以供验证
          df -h

      # 10. 核心编译步骤 (Compile firmware)
      # 【增强】将日志输出到文件 build.log
      - name: Compile firmware
        id: compile
        run: |
          # V=s 详细输出，-j${BUILD_THREADS} 使用多线程加速
          echo "Start compiling..."
          set -o pipefail # 确保 make 失败时，整个命令失败
          # 由于已在步骤 9 清理，此处直接 make
          make -j${BUILD_THREADS} V=s 2>&1 | tee build.log # 同时输出到控制台和日志文件

      # 11. 失败时打印日志 (Error Report)
      - name: Print failure log
        if: ${{ failure() && steps.compile.outcome == 'failure' }}
        run: |
          echo "::error::--- 编译失败日志尾部 (最后 50 行) ---"
          tail -n 50 build.log
          echo "::error::------------------------------------------"
          
      # 12. 整理并压缩产物 (Package artifacts)
      # 依赖于步骤 10 成功
      - name: Package artifacts
        if: success()
        run: |
          cd bin/targets/arm64/generic
          # 找到我们需要的 img.gz 文件。使用 2>/dev/null || echo "" 确保找不到文件时脚本不会立即退出。
          IMG_FILE=$(ls openwrt-*-arm64-generic-ext4-combined.img.gz 2>/dev/null || echo "")

          if [ -n "$IMG_FILE" ]; then
              # 创建一个 ZIP 包包含固件
              zip -r build_artifacts.zip "$IMG_FILE"
              echo "::set-output name=found::true"
          else
              echo "::error file=Package artifacts::无法找到目标固件文件 openwrt-*-arm64-generic-ext4-combined.img.gz。编译可能未完成或路径错误。"
              echo "::set-output name=found::false"
              exit 1
          fi

      # 13. 上传固件 (Upload artifacts)
      # 依赖于步骤 12 成功找到文件
      - name: Upload firmware to release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_AArch64_192.168.1.250
          path: bin/targets/arm64/generic/build_artifacts.zip
          retention-days: 7
